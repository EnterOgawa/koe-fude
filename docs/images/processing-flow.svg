<svg xmlns="http://www.w3.org/2000/svg" width="810" height="136" viewBox="0 0 810 136" role="img" aria-labelledby="flow-title flow-description">
  <title id="flow-title">KoeFudeの仕組み</title>
  <desc id="flow-description">録音をPC内で文字起こし・話者分けし、時刻・話者付き原文を表示します。任意のAPI文章改善を明示実行するときだけ全文を送信し、API改善文を原文と比較できます。</desc>
  <rect width="810" height="136" fill="#ffffff"/>
  <g fill="#f1ebf7" stroke="#a28bb8" stroke-width="1.5">
    <rect x="16" y="44" width="76" height="72" rx="8"/>
    <rect x="124" y="44" width="200" height="72" rx="8"/>
    <rect x="356" y="44" width="174" height="72" rx="8"/>
    <rect x="620" y="44" width="174" height="72" rx="8" fill="#f7f3fa"/>
  </g>
  <g fill="none" stroke="#79618f" stroke-width="1.75">
    <path d="M 93 80 H 116"/>
    <path d="M 325 80 H 348"/>
    <path d="M 531 80 H 612" stroke-dasharray="5 5"/>
  </g>
  <g fill="#79618f">
    <path d="M 115 75 L 123 80 L 115 85 Z"/>
    <path d="M 347 75 L 355 80 L 347 85 Z"/>
    <path d="M 611 75 L 619 80 L 611 85 Z"/>
  </g>
  <g fill="#30223c" font-family="'Yu Gothic UI', 'Meiryo', sans-serif" font-size="18" text-anchor="middle">
    <text x="54" y="87">録音</text>
    <text x="224" y="72">PC内：</text>
    <text x="224" y="97">文字起こし・話者分け</text>
    <text x="443" y="72">時刻・話者付き</text>
    <text x="443" y="97">原文</text>
    <text x="707" y="72">API改善文</text>
    <text x="707" y="97" font-size="16">（原文と比較）</text>
    <text x="575" y="29" font-size="16" fill="#665176">任意・全文送信</text>
  </g>
</svg>
